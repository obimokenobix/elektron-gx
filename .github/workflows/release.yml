# Baut Elektron GX auf einem echten Windows-Rechner von GitHub und veröffentlicht
# Installer + Update-Dateien als Release – automatisch, sobald in package.json
# eine neue Versionsnummer steht (oder per Hand über "Run workflow").
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version lesen
        id: ver
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        if: steps.ver.outputs.exists == 'false'
        run: npm ci

      - name: Windows-Installer bauen
        if: steps.ver.outputs.exists == 'false'
        run: npx electron-builder --win --publish never

      - name: Starttest – startet die gebaute Version wirklich?
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: |
          node scripts/check-fuses.js "dist/win-unpacked/Elektron GX.exe"
          if ($LASTEXITCODE -ne 0) { throw "Sicherheits-Schalter fehlen" }
          $out = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $env:ELEKTRON_SMOKE = $out
          $p = Start-Process -FilePath "dist/win-unpacked/Elektron GX.exe" -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw 'Browser hat sich nicht beendet (Zeitüberschreitung)' }
          if (-not (Test-Path $out)) { throw 'Browser ist nicht richtig gestartet – Veröffentlichung abgebrochen' }
          Get-Content $out
          $r = Get-Content $out | ConvertFrom-Json
          if (-not $r.ok) { throw 'Starttest fehlgeschlagen' }

      - name: Release veröffentlichen
        if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Elektron GX ${{ steps.ver.outputs.version }}
          make_latest: true
          body: |
            **Installieren:** `Elektron-GX-Setup-${{ steps.ver.outputs.version }}.exe` herunterladen und starten.
            Windows SmartScreen fragt evtl. nach → „Weitere Informationen“ → „Trotzdem ausführen“.

            Bereits installierte Browser aktualisieren sich automatisch.
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
