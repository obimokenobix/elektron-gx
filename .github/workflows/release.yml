# Baut Elektron auf einem echten Windows-Rechner von GitHub und veröffentlicht
# Installer + Update-Dateien als Release – automatisch, sobald in package.json
# eine neue Versionsnummer steht (oder per Hand über "Run workflow").
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Signieren über SignPath (kostenlos für Open Source) – aktiv, sobald das Secret SIGNPATH_API_TOKEN
      # und die Variable SIGNPATH_ORGANIZATION_ID im Repository eingetragen sind. Sonst wie bisher unsigniert.
      SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Version lesen
        id: ver
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        if: steps.ver.outputs.exists == 'false'
        run: npm ci

      - name: Windows-Installer bauen
        if: steps.ver.outputs.exists == 'false' && env.SIGN != 'true'
        run: npx electron-builder --win --publish never

      - name: Programm bauen (zum Signieren)
        if: steps.ver.outputs.exists == 'false' && env.SIGN == 'true'
        run: npx electron-builder --win --dir --publish never

      - name: Starttest – startet die gebaute Version wirklich?
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: |
          node scripts/check-fuses.js "dist/win-unpacked/Elektron.exe"
          if ($LASTEXITCODE -ne 0) { throw "Sicherheits-Schalter fehlen" }
          $out = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $env:ELEKTRON_SMOKE = $out
          $p = Start-Process -FilePath "dist/win-unpacked/Elektron.exe" -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw 'Browser hat sich nicht beendet (Zeitüberschreitung)' }
          if (-not (Test-Path $out)) { throw 'Browser ist nicht richtig gestartet – Veröffentlichung abgebrochen' }
          Get-Content $out
          $r = Get-Content $out | ConvertFrom-Json
          if (-not $r.ok) { throw 'Starttest fehlgeschlagen' }

      # ---------------------------------------------------------------- Signieren (SignPath)
      - name: Programm zum Signieren hochladen
        id: up-app
        if: steps.ver.outputs.exists == 'false' && env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigniert-programm
          path: dist/win-unpacked/

      - name: Programm signieren (SignPath – Freigabe nötig)
        if: steps.ver.outputs.exists == 'false' && env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'elektron' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: programm
          github-artifact-id: ${{ steps.up-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 21600
          output-artifact-directory: dist/win-unpacked-signiert

      - name: Installer aus dem signierten Programm bauen
        if: steps.ver.outputs.exists == 'false' && env.SIGN == 'true'
        shell: pwsh
        run: |
          node scripts/check-fuses.js "dist/win-unpacked-signiert/Elektron.exe"
          if ($LASTEXITCODE -ne 0) { throw "Sicherheits-Schalter fehlen nach dem Signieren" }
          npx electron-builder --win nsis --prepackaged dist/win-unpacked-signiert --publish never

      - name: Installer zum Signieren hochladen
        id: up-setup
        if: steps.ver.outputs.exists == 'false' && env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigniert-installer
          path: dist/Elektron-Setup-${{ steps.ver.outputs.version }}.exe

      - name: Installer signieren (SignPath – Freigabe nötig)
        if: steps.ver.outputs.exists == 'false' && env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'elektron' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.up-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 21600
          output-artifact-directory: dist/signiert

      - name: Signierten Installer übernehmen
        if: steps.ver.outputs.exists == 'false' && env.SIGN == 'true'
        shell: pwsh
        run: |
          Copy-Item "dist/signiert/Elektron-Setup-${{ steps.ver.outputs.version }}.exe" "dist/" -Force
          node scripts/update-latest-yml.js dist
          $sig = Get-AuthenticodeSignature "dist/Elektron-Setup-${{ steps.ver.outputs.version }}.exe"
          Write-Host "Signatur: $($sig.Status) – $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Installer ist nicht gültig signiert" }

      - name: Release veröffentlichen
        if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Elektron ${{ steps.ver.outputs.version }}
          make_latest: true
          body: |
            **Installieren:** `Elektron-Setup-${{ steps.ver.outputs.version }}.exe` herunterladen und starten.
            ${{ env.SIGN == 'true' && 'Der Installer ist digital signiert (SignPath Foundation).' || 'Windows SmartScreen fragt evtl. nach → „Weitere Informationen“ → „Trotzdem ausführen“.' }}

            Bereits installierte Browser aktualisieren sich automatisch.
          files: |
            dist/Elektron-Setup-*.exe
            dist/*.blockmap
            dist/latest.yml
