# Baut das Paket für den Microsoft Store (.appx) – per Hand starten unter Actions → "Microsoft Store" → "Run workflow".
# Vorher in package.json unter build.appx die Werte aus dem Partner Center eintragen:
#   identityName, publisher (CN=…), publisherDisplayName
name: Microsoft Store

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appx:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Store-Paket bauen
        run: npx electron-builder --win appx --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Elektron-GX-Microsoft-Store
          path: dist/*.appx
      - name: Version lesen
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Zusätzlich als Vorab-Release ablegen, damit das Paket mit einem einfachen Link herunterladbar ist
      # (Vorab-Releases zählen nicht als "neueste Version" – die Update-Funktion bleibt unberührt)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: store-${{ steps.ver.outputs.version }}
          name: Microsoft-Store-Paket ${{ steps.ver.outputs.version }}
          body: Nur zum Hochladen im Microsoft Partner Center – nicht zum direkten Installieren. Den normalen Installer gibt es unter "Latest".
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: dist/*.appx
