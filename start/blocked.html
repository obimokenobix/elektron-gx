<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>Gefährliche Seite blockiert</title>
  <link rel="stylesheet" href="internal.css">
  <link rel="stylesheet" href="warn.css">
</head>
<body class="danger">
  <div class="box">
    <div class="sign"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M12 8v5M12 16.5h.01"/></svg></div>
    <h1 id="title">Gefährliche Seite blockiert</h1>
    <div class="host" id="host"></div>
    <p id="text">Elektron hat diese Seite gestoppt, weil sie auf einer Liste bekannter Betrugsseiten steht.</p>
    <ul id="list"></ul>
    <div class="actions">
      <button class="btn primary big" id="back" type="button">Zurück in Sicherheit</button>
    </div>
    <details>
      <summary>Details</summary>
      <p id="detail"></p>
      <button class="risk" id="proceed" type="button">Ich verstehe das Risiko – Seite trotzdem öffnen</button>
    </details>
    <p class="src">Elektron Schutz · Listen von Phishing.Database und URLhaus (abuse.ch)</p>
  </div>
  <script src="warn.js"></script>
</body>
</html>
