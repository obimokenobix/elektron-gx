<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Schwebendes Fenster</title>
  <link rel="stylesheet" href="float.css">
</head>
<body>
  <div class="bar">
    <span class="fav"><img id="fav" src="../assets/icon.png" alt=""></span>
    <span id="title">Elektron</span>
    <label class="opacity" title="Transparenz">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
      <input type="range" id="op" min="20" max="100" step="5" value="100">
    </label>
    <button id="pin" class="on" title="Immer im Vordergrund">
      <svg viewBox="0 0 24 24"><path d="M9 4h6l-1 5 4 4H6l4-4z"/><path d="M12 13v7"/></svg>
    </button>
    <button id="pip" title="Video ausklappen (Bild-in-Bild)">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="6" rx="1" fill="currentColor"/></svg>
    </button>
    <button id="dock" title="Zurück in den Browser">
      <svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-8 8"/><path d="M10 6H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5" /></svg>
    </button>
    <button id="close" class="danger" title="Tab schließen">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <script src="float.js"></script>
</body>
</html>
